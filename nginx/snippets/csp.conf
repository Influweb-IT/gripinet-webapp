# Country Content-Security-Policy directives (owned by this repo, never touched by copier update).
# One directive per line. Only the policy lives here: security-headers.conf (template) sends
# the header and appends upgrade-insecure-requests for https clients.
#
# Baseline: app + reCAPTCHA, plus https://hivlab.github.io (the results page iframe,
# pages.json /results -> iframeEmbed). Check every page in a browser for "Refused to ..." errors.

set $csp "default-src 'self'";
set $csp "${csp}; base-uri 'self'";
set $csp "${csp}; object-src 'none'";
set $csp "${csp}; frame-ancestors 'none'";
set $csp "${csp}; media-src 'self'";
set $csp "${csp}; script-src 'self' https://hivlab.github.io https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/";
set $csp "${csp}; style-src 'self' 'unsafe-inline' https://hivlab.github.io https://www.gstatic.com/recaptcha/ https://www.google.com/recaptcha/";
set $csp "${csp}; img-src 'self' data: https:";
set $csp "${csp}; font-src 'self' data:";
set $csp "${csp}; frame-src 'self' https://hivlab.github.io https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/";
set $csp "${csp}; child-src https://www.google.com/ https://hivlab.github.io";
set $csp "${csp}; connect-src 'self' https://hivlab.github.io https://www.google.com/recaptcha/ https://www.google.com/";
